model_name: facebook/dinov3-vitl16-pretrain-lvd1689m
train_lmdb: /path/to/Image_detection_datasets/WildFake/train
source_map: configs/wildfake_sources.json
output_dir: outputs/fiser_wildfake

seed: 42
epochs: 20
image_size: 224
per_device_batch_size: 40
global_batch_size: 1280
num_workers: 8
temperature: 0.07
fine_weight: 1.0
coarse_weight: 1.0

learning_rate: 3.0e-5
min_learning_rate: 5.0e-6
warmup_steps: 2000
weight_decay: 1.0e-4
adam_beta1: 0.9
adam_beta2: 0.99
adam_epsilon: 1.0e-6
max_grad_norm: 1.0

precision: bf16
gradient_checkpointing: true
ddp_static_graph: true
save_every_epochs: 1
log_every_steps: 10
