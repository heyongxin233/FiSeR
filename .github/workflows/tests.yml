name: tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install huggingface-hub lmdb numpy Pillow pyarrow PyYAML safetensors scikit-learn tqdm "transformers>=4.56.1,<5" pytest ruff
          python -m pip install -e . --no-deps
      - name: Static checks
        run: ruff check .
      - name: Unit tests
        run: pytest -q
