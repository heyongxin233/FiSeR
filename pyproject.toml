[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiser-aigc-detection"
version = "0.1.0"
description = "Fine-Grained Source Representations for Cross-Domain AI Image Detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Shan Zhang"},
  {name = "Yongxin He"},
  {name = "Mingming Zhang"},
  {name = "Huiwen Tian"},
  {name = "Lei Ma"},
]
dependencies = [
  "faiss-gpu>=1.8.0",
  "huggingface-hub>=0.28.0",
  "lmdb>=1.4.1",
  "numpy>=1.24,<3",
  "Pillow>=10.0",
  "pyarrow>=15.0",
  "PyYAML>=6.0",
  "safetensors>=0.4.5",
  "scikit-learn>=1.3",
  "torch>=2.3",
  "torchvision>=0.18",
  "tqdm>=4.66",
  "transformers>=4.56.1,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
gpu-svm = ["cuml-cu12>=25.2,<26"]
baselines = [
  "albumentations>=1.4,<2",
  "ftfy>=6.3",
  "kornia>=0.8",
  "lightning>=2.4",
  "open-clip-torch>=3.3",
  "pytorch-wavelets>=1.3",
  "tensorboardX>=2.6",
]

[project.urls]
Homepage = "https://github.com/heyongxin233/FiSeR"
Repository = "https://github.com/heyongxin233/FiSeR"
Paper = "https://arxiv.org/abs/2606.00606"
Model = "https://huggingface.co/heyongxin233/FiSeR-DINOv3-ViT-L16"

[tool.setuptools]
py-modules = [
  "evaluate",
  "extract_embeddings",
  "infer",
  "train",
]

[tool.setuptools.packages.find]
include = ["fiser*", "scripts*", "baselines"]
exclude = ["baselines.tests*", "baselines.vendor*"]

[tool.pytest.ini_options]
testpaths = ["tests", "baselines/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["baselines/vendor"]
